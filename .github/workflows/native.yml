name: Native backend

on:
  push:
    branches: [main]
    paths: ['torchdt/**', 'setup.py', 'pyproject.toml', '.github/workflows/native.yml']
  pull_request:
    paths: ['torchdt/**', 'setup.py', 'pyproject.toml', '.github/workflows/native.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TORCHDT_STRICT_CPP: '1'
      MAX_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'setuptools>=69' wheel ninja numpy
      - name: Build native extension
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Check native arithmetic and gradients
        run: |
          python - <<'PY'
          import torch
          from torchdt.lns import LNS16, LNS32, LNS64
          from torchdt.ops.cpp_ops import C

          assert C is not None, 'Native extension did not load'
          for dtype in (LNS16, LNS32, LNS64):
              dtype.set_prec(7)
              dtype.enable_cpp_backend()
              values = torch.tensor([[1., 2.], [3., 4.]])
              x = dtype(values, requires_grad=True)
              squared = x * x
              torch.testing.assert_close(squared.to_float(), values.double().square(), rtol=0.03, atol=0.01)
              result = x @ dtype(torch.eye(2))
              torch.testing.assert_close(result.to_float(), values.double(), rtol=0.03, atol=0.01)
              result.sum().backward()
              torch.testing.assert_close(x.grad.to_float(), torch.ones_like(values).double(), rtol=0.03, atol=0.01)
          PY
